spring.application.name=AutoLoc

# ===== Serveur =====
# Préfixe commun pour toutes les routes de l'API
server.servlet.context-path=/api
server.port=8081

# ===== Datasource H2 (en mémoire) =====
spring.datasource.url=jdbc:h2:mem:autoloc
spring.datasource.username=sa
spring.datasource.password=

# ===== JPA / Hibernate =====
# Affiche les requêtes SQL générées en console
spring.jpa.show-sql=true
# Stratégie de génération des tables : update
spring.jpa.hibernate.ddl-auto=update

# ===== Jackson =====
# Palliatif temporaire pour les proxies LAZY Hibernate (disparaîtra avec les DTO)
spring.jackson.serialization.fail-on-empty-beans=false
