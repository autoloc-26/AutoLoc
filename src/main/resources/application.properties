spring.application.name=AutoLoc

# ===== Serveur =====
# Préfixe commun pour toutes les routes de l'API
server.servlet.context-path=/api

# ===== Datasource MySQL =====
# URL de connexion à la BDD MySQL :
spring.datasource.url=jdbc:mysql://localhost:3306/AutoLoc?createDatabaseIfNotExist=true
# Nom d'utilisateur MySQL
spring.datasource.username=root
# Mot de passe MySQL
spring.datasource.password=
# ===== JPA / Hibernate =====
# Affiche les requêtes SQL générées en console
spring.jpa.show-sql=true
# Stratégie de génération des tables : update
spring.jpa.hibernate.ddl-auto=update

# ===== Jackson =====
# Palliatif temporaire pour les proxies LAZY Hibernate (disparaîtra avec les DTO)
spring.jackson.serialization.fail-on-empty-beans=false